[workspace]
members = [
    "crates/render-core",
    "crates/render-wasm",
    "crates/studio-core",
    "crates/studio-wasm",
    "crates/design-core",
    "crates/design-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
